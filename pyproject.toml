[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "predictmaint"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pandas>=2.2,<3", "numpy>=1.26,<3", "scikit-learn>=1.6,<1.8", "xgboost>=2.1,<4", "shap>=0.46,<0.51", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "joblib>=1.4,<2", "matplotlib>=3.9,<4", "PyYAML>=6,<7", "httpx>=0.27,<1", "python-dotenv>=1,<2"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1"]
[project.scripts]
predictmaint = "predictmaint.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["build", "dist"]
[tool.ruff.lint]
select = ["E", "F", "I"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.coverage.run]
source = ["predictmaint"]
